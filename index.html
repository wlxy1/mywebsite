<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>弦月剑仙 · 个人主页</title>
    <meta name="theme-color" content="#0a0a1a" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ========== 全局变量 ========== */
        :root {
            --bg-body: #0b0b1a;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0ff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --neon-start: #00b4ff;
            --neon-end: #7b2ffc;
            --glow-color: rgba(0, 180, 255, 0.3);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.6);
            --radius-card: 24px;
            --transition: 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            --nav-height: 60px;
        }

        /* 亮色主题 */
        [data-theme="light"] {
            --bg-body: #f5f5fc;
            --bg-glass: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-muted: rgba(0, 0, 0, 0.4);
            --glow-color: rgba(0, 100, 255, 0.15);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        /* ========== 重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0, 120, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(100, 0, 255, 0.06) 0%, transparent 60%);
        }

        /* ========== Canvas 粒子 ========== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 鼠标光晕 ========== */
        .glow-ring {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .glow-ring.visible {
            opacity: 1;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 100;
            background: rgba(var(--bg-body-rgb, 11, 11, 26), 0.7);
            backdrop-filter: blur(16px) saturate(1.5);
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            padding: 0 24px;
            transition: background 0.3s, border-color var(--transition);
        }
        .navbar.scrolled {
            background: rgba(var(--bg-body-rgb, 11, 11, 26), 0.9);
        }
        [data-theme="light"] .navbar {
            background: rgba(245, 245, 252, 0.7);
        }
        [data-theme="light"] .navbar.scrolled {
            background: rgba(245, 245, 252, 0.9);
        }

        .nav-inner {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }
        .brand .logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 30px var(--glow-color);
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none;
        }
        .nav-links a {
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.25s;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-links a:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }
        .nav-links a.active {
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            color: #fff;
            box-shadow: 0 0 24px var(--glow-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-clock {
            text-align: right;
            line-height: 1.2;
            margin-right: 6px;
        }
        .nav-clock .time {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .nav-clock .date {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.25s;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .theme-toggle:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: 0.25s;
        }
        .hamburger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ========== 主容器 ========== */
        .main {
            position: relative;
            z-index: 1;
            margin-top: var(--nav-height);
            min-height: calc(100vh - var(--nav-height));
            min-height: calc(100dvh - var(--nav-height));
        }

        /* ========== 页面切换 ========== */
        .page {
            display: none;
            opacity: 0;
            transform: translateY(24px) scale(0.97);
            transition: opacity 0.5s ease, transform 0.5s ease;
            padding: 40px 24px 60px;
            min-height: calc(100vh - var(--nav-height));
            min-height: calc(100dvh - var(--nav-height));
        }
        .page.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .page.exit {
            display: flex;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            pointer-events: none;
        }

        /* ========== 首页 ========== */
        .hero {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-card {
            max-width: 620px;
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-card);
            padding: 48px 40px 40px;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s ease, box-shadow 0.3s, background var(--transition),
                border-color var(--transition);
            position: relative;
            overflow: hidden;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 180, 255, 0.03), transparent,
                    rgba(123, 47, 252, 0.03), transparent);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .hero-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--border-glass);
            margin: 0 auto 24px;
            box-shadow: 0 0 60px var(--glow-color);
            object-fit: cover;
            background: var(--bg-body);
            position: relative;
            z-index: 1;
            transition: border-color var(--transition);
        }

        .hero-name {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }
        .hero-name .highlight {
            background: linear-gradient(135deg, #f9d71c, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-tagline {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 8px 0 6px;
            min-height: 2em;
            position: relative;
            z-index: 1;
        }
        .hero-tagline .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--neon-start);
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .hero-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-glass);
            color: var(--text-primary);
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            border: none;
            color: #fff;
            box-shadow: 0 4px 30px var(--glow-color);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 50px var(--glow-color);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-secondary);
            transform: translateY(-3px);
        }

        /* ========== 日历 ========== */
        .calendar {
            margin-top: 32px;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
            padding: 16px 18px 14px;
            background: var(--bg-glass);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            position: relative;
            z-index: 1;
            transition: background var(--transition), border-color var(--transition);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .calendar-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .calendar-nav {
            display: flex;
            gap: 6px;
        }
        .calendar-nav button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--bg-glass);
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }
        .calendar-nav button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-weekday {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
            text-transform: uppercase;
        }
        .calendar-day {
            font-size: 0.7rem;
            padding: 4px 0;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: 0.15s;
        }
        .calendar-day.other {
            color: var(--text-muted);
            opacity: 0.4;
        }
        .calendar-day.today {
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            color: #fff;
            font-weight: 700;
        }

        /* ========== 关于 & 联系 ========== */
        .section-page {
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .section-container {
            max-width: 720px;
            width: 100%;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-start), var(--neon-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .section-sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-card);
            padding: 32px 28px;
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition);
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        .about-text {
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 18px;
        }
        .about-text strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tag {
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .tag i {
            color: var(--neon-start);
        }
        .tag:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--text-secondary);
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-weight: 500;
            transition: 0.25s;
            text-decoration: none;
            cursor: pointer;
            position: relative;
        }
        .social-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        .social-link:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--text-secondary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        .social-link[data-platform="bilibili"] i {
            color: #00a1d6;
        }
        .social-link[data-platform="qq"] i {
            color: #12b7f5;
        }
        .social-link[data-platform="email"] i {
            color: var(--neon-start);
        }
        .social-link[data-platform="weibo"] i {
            color: #e6162d;
        }
        .social-link[data-platform="qq"]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            white-space: nowrap;
            border: 1px solid var(--border-glass);
        }
        .social-link[data-platform="qq"]:hover::after {
            opacity: 1;
        }

        /* ========== Footer ========== */
        .footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border-glass);
            padding: 18px 24px;
            text-align: center;
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            transition: background var(--transition), border-color var(--transition);
        }
        .footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: var(--neon-start);
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--bg-body);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 20px;
                gap: 4px;
                transform: translateY(-120%);
                opacity: 0;
                transition: 0.3s;
                pointer-events: none;
                border-bottom: 1px solid var(--border-glass);
            }
            .nav-links.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .nav-links a {
                padding: 12px 16px;
                border-radius: 12px;
                width: 100%;
                text-align: left;
            }
            .hamburger {
                display: flex;
            }
            .nav-clock .date {
                display: none;
            }

            .hero-card {
                padding: 32px 20px 28px;
            }
            .hero-name {
                font-size: 2rem;
            }
            .hero-avatar {
                width: 90px;
                height: 90px;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }
            .section-page {
                padding: 24px 16px;
            }
            .glass-card {
                padding: 24px 18px;
            }
        }

        @media (max-width: 420px) {
            .hero-name {
                font-size: 1.6rem;
            }
            .hero-avatar {
                width: 72px;
                height: 72px;
            }
            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            .calendar {
                max-width: 220px;
                padding: 12px 10px;
            }
            .calendar-day {
                font-size: 0.65rem;
                padding: 3px 0;
            }
        }

        /* 横屏适配 */
        @media (orientation: landscape) and (max-height: 600px) {
            .hero-card {
                padding: 24px 28px 20px;
            }
            .hero-avatar {
                width: 60px;
                height: 60px;
                margin-bottom: 12px;
            }
            .hero-name {
                font-size: 1.4rem;
            }
            .hero-tagline {
                font-size: 0.8rem;
                min-height: 1.5em;
            }
            .hero-sub {
                display: none;
            }
            .calendar {
                display: none;
            }
            .hero-actions {
                gap: 10px;
            }
            .btn {
                padding: 6px 16px;
                font-size: 0.7rem;
            }
            .section-page {
                padding: 16px;
            }
            .glass-card {
                padding: 16px;
            }
            .about-text {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }
            .social-link {
                padding: 10px 14px;
                font-size: 0.8rem;
            }
        }

        /* 减少动画 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .hero-card::before {
                animation: none !important;
            }
            .glow-ring {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Canvas 粒子 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 鼠标光晕 -->
    <div class="glow-ring" id="glowRing"></div>

    <!-- ====== 导航栏 ====== -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="#home" class="brand" id="brandLink">
                <span class="logo">弦</span>
                <span>弦月剑仙</span>
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="#home" data-page="home" class="active" aria-current="page">首页</a></li>
                <li><a href="#about" data-page="about">关于我</a></li>
                <li><a href="#contact" data-page="contact">联系我</a></li>
            </ul>

            <div class="nav-actions">
                <div class="nav-clock">
                    <div class="time" id="navTime">00:00:00</div>
                    <div class="date" id="navDate">2026/1/1</div>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>

    <!-- ====== JavaScript ====== -->
    <script>
        (function() {
            'use strict';

            // -------- DOM refs --------
            const navbar = document.getElementById('navbar');
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            const navLinkItems = navLinks.querySelectorAll('a');
            const brandLink = document.getElementById('brandLink');
            const footerBrandLink = document.getElementById('footerBrandLink');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const heroAboutBtn = document.getElementById('heroAboutBtn');
            const heroContactBtn = document.getElementById('heroContactBtn');
            const pages = document.querySelectorAll('.page');
            const qqButton = document.getElementById('qqButton');
            const toast = document.getElementById('toast');
            const navTime = document.getElementById('navTime');
            const navDate = document.getElementById('navDate');
            const calendarTitle = document.getElementById('calendarTitle');
            const calendarGrid = document.getElementById('calendarGrid');
            const prevMonthBtn = document.getElementById('prevMonthBtn');
            const nextMonthBtn = document.getElementById('nextMonthBtn');
            const typingText = document.getElementById('typingText');
            const glowRing = document.getElementById('glowRing');
            const heroCard = document.getElementById('heroCard');

            let isTransitioning = false;

            // -------- Toast --------
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            // -------- QQ copy --------
            function copyQQ() {
                const qq = '3697823121';
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(qq)
                        .then(() => showToast('✅ 已复制 QQ：' + qq))
                        .catch(() => fallbackCopy(qq));
                } else {
                    fallbackCopy(qq);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (_) {}
                document.body.removeChild(ta);
                showToast(ok ? '✅ 已复制 QQ：' + text : '❌ 复制失败，请手动输入：' + text);
            }
            if (qqButton) qqButton.addEventListener('click', (e) => { e.preventDefault();
                copyQQ(); });

            // -------- Page switching --------
            function updateNav(pageId) {
                navLinkItems.forEach(link => {
                    const active = link.dataset.page === pageId;
                    link.classList.toggle('active', active);
                    if (active) link.setAttribute('aria-current', 'page');
                    else link.removeAttribute('aria-current');
                });
            }

            function switchPage(pageId, updateHash = true) {
                if (isTransitioning) return;
                const target = document.getElementById('page-' + pageId);
                if (!target) return;
                const current = document.querySelector('.page.active');
                if (current === target) return;

                isTransitioning = true;

                if (!current) {
                    target.classList.add('active');
                    updateNav(pageId);
                    if (updateHash) history.pushState(null, '', '#' + pageId);
                    closeMenu();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    isTransitioning = false;
                    return;
                }

                current.classList.add('exit');
                setTimeout(() => {
                    current.classList.remove('active', 'exit');
                    target.classList.add('active');
                    updateNav(pageId);
                    if (updateHash) history.pushState(null, '', '#' + pageId);
                    closeMenu();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    isTransitioning = false;
                }, 450);
            }

            // 导航点击
            navLinkItems.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const pid = link.dataset.page;
                    if (pid) switchPage(pid, true);
                });
            });
            brandLink.addEventListener('click', (e) => { e.preventDefault();
                switchPage('home', true); });
            footerBrandLink.addEventListener('click', (e) => { e.preventDefault();
                switchPage('home', true); });
            heroAboutBtn.addEventListener('click', () => switchPage('about', true));
            heroContactBtn.addEventListener('click', () => switchPage('contact', true));

            // -------- Mobile menu --------
            function closeMenu() {
                navLinks.classList.remove('open');
                hamburger.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
                document.body.style.overflow = '';
            }

            function toggleMenu() {
                if (navLinks.classList.contains('open')) {
                    closeMenu();
                } else {
                    navLinks.classList.add('open');
                    hamburger.classList.add('active');
                    hamburger.setAttribute('aria-expanded', 'true');
                    document.body.style.overflow = 'hidden';
                }
            }
            hamburger.addEventListener('click', toggleMenu);
            document.addEventListener('click', (e) => {
                if (navLinks.classList.contains('open') && !navbar.contains(e.target)) closeMenu();
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

            // -------- Navbar shadow --------
            window.addEventListener('scroll', () => {
                navbar.classList.toggle('scrolled', window.scrollY > 10);
            }, { passive: true });

            // -------- Theme --------
            function getTheme() {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('theme', theme); } catch (_) {}
                updateThemeIcon(theme);
            }

            function updateThemeIcon(theme) {
                themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
                themeToggle.setAttribute('aria-label', theme === 'dark' ? '切换亮色' : '切换暗色');
            }

            // 初始化主题
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (_) {}
            if (!savedTheme) {
                savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            setTheme(savedTheme);

            themeToggle.addEventListener('click', () => {
                const current = getTheme();
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // 系统主题变化
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', (e) => {
                try {
                    if (!localStorage.getItem('theme')) {
                        setTheme(e.matches ? 'dark' : 'light');
                    }
                } catch (_) {}
            });

            // -------- Clock --------
            function updateClock() {
                const now = new Date();
                navTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                navDate.textContent = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate();
            }
            updateClock();
            setInterval(updateClock, 1000);

            // -------- Calendar --------
            let calYear = new Date().getFullYear(),
                calMonth = new Date().getMonth();

            function renderCalendar() {
                const first = new Date(calYear, calMonth, 1);
                const last = new Date(calYear, calMonth + 1, 0);
                const days = last.getDate();
                const startW = first.getDay();
                calendarTitle.textContent = calYear + '年' + (calMonth + 1) + '月';

                const today = new Date();
                const ty = today.getFullYear(),
                    tm = today.getMonth(),
                    td = today.getDate();

                let html = '';
                const wd = ['日', '一', '二', '三', '四', '五', '六'];
                for (let i = 0; i < 7; i++) html += '<div class="calendar-weekday">' + wd[i] + '</div>';

                const pm = calMonth === 0 ? 11 : calMonth - 1;
                const py = calMonth === 0 ? calYear - 1 : calYear;
                const dpm = new Date(py, pm + 1, 0).getDate();
                for (let i = startW - 1; i >= 0; i--) {
                    html += '<div class="calendar-day other">' + (dpm - i) + '</div>';
                }
                for (let d = 1; d <= days; d++) {
                    const isToday = (calYear === ty && calMonth === tm && d === td);
                    html += '<div class="calendar-day' + (isToday ? ' today' : '') + '">' + d + '</div>';
                }
                const total = startW + days;
                const rem = (7 - (total % 7)) % 7;
                for (let i = 1; i <= rem; i++) {
                    html += '<div class="calendar-day other">' + i + '</div>';
                }
                calendarGrid.innerHTML = html;
            }
            prevMonthBtn.addEventListener('click', () => { calMonth--;
                if (calMonth < 0) { calMonth = 11;
                    calYear--; }
                renderCalendar(); });
            nextMonthBtn.addEventListener('click', () => { calMonth++;
                if (calMonth > 11) { calMonth = 0;
                    calYear++; }
                renderCalendar(); });
            renderCalendar();

            // -------- Typing effect --------
            const phrases = [
                '嗨，我是弦月剑仙，分享有趣的内容与生活记录。',
                '✨ 用文字记录灵感，用代码构建想象。',
                '🌙 在创作的道路上，持续探索，永不停歇。',
                '📖 把故事讲给世界听。'
            ];
            let pIdx = 0,
                cIdx = 0,
                deleting = false,
                timer = null;

            function typeLoop() {
                const cur = phrases[pIdx];
                if (!deleting) {
                    typingText.textContent = cur.substring(0, cIdx + 1);
                    cIdx++;
                    if (cIdx === cur.length) { deleting = true;
                        timer = setTimeout(typeLoop, 2800); return; }
                    timer = setTimeout(typeLoop, 50 + Math.random() * 40);
                } else {
                    typingText.textContent = cur.substring(0, cIdx - 1);
                    cIdx--;
                    if (cIdx === 0) { deleting = false;
                        pIdx = (pIdx + 1) % phrases.length;
                        timer = setTimeout(typeLoop, 400); return; }
                    timer = setTimeout(typeLoop, 25 + Math.random() * 20);
                }
            }
            setTimeout(typeLoop, 600);

            // -------- Mouse glow --------
            let glowVisible = false,
                glowTimer = null;
            document.addEventListener('mousemove', (e) => {
                glowRing.style.left = e.clientX + 'px';
                glowRing.style.top = e.clientY + 'px';
                if (!glowVisible) { glowVisible = true;
                    glowRing.classList.add('visible'); }
                clearTimeout(glowTimer);
                glowTimer = setTimeout(() => { glowVisible = false;
                    glowRing.classList.remove('visible'); }, 2000);
            });
            document.addEventListener('mouseleave', () => { glowVisible = false;
                glowRing.classList.remove('visible'); });
            if ('ontouchstart' in window) glowRing.style.display = 'none';

            // -------- 3D tilt (desktop only) --------
            if (heroCard && !('ontouchstart' in window)) {
                heroCard.addEventListener('mousemove', (e) => {
                    const rect = heroCard.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    heroCard.style.transform =
                        `perspective(1000px) rotateX(${y * -6}deg) rotateY(${x * 6}deg) scale(1.01)`;
                });
                heroCard.addEventListener('mouseleave', () => {
                    heroCard.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
                });
            }

            // -------- Particle system --------
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [],
                count, animId;

            function resize() {
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w;
                canvas.height = h;
                count = Math.min(100, Math.floor((w * h) / 15000));
                initParticles();
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        r: 1 + Math.random() * 2,
                        a: 0.3 + Math.random() * 0.4,
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);

                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                const baseColor = theme === 'dark' ? 'rgba(255,255,255,' : 'rgba(26,26,46,';

                // 更新位置
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                }

                // 绘制光晕粒子
                for (const p of particles) {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
                    grad.addColorStop(0, baseColor + (p.a * 0.8) + ')');
                    grad.addColorStop(1, baseColor + '0)');
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                // 连线
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 130;
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.2;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = baseColor + alpha + ')';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                // 鼠标吸引 (桌面)
                if (!('ontouchstart' in window) && window._mouseX !== undefined) {
                    const mx = window._mouseX,
                        my = window._mouseY;
                    for (const p of particles) {
                        const dx = mx - p.x,
                            dy = my - p.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 180 && dist > 1) {
                            const force = (180 - dist) / 180 * 0.015;
                            p.vx += dx * force;
                            p.vy += dy * force;
                            // 限制速度
                            const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                            if (sp > 1.0) { p.vx = (p.vx / sp) * 1.0;
                                p.vy = (p.vy / sp) * 1.0; }
                        }
                    }
                }

                animId = requestAnimationFrame(draw);
            }

            // 鼠标位置跟踪
            window._mouseX = undefined;
            window._mouseY = undefined;
            document.addEventListener('mousemove', (e) => {
                window._mouseX = e.clientX;
                window._mouseY = e.clientY;
            });
            document.addEventListener('mouseleave', () => {
                window._mouseX = undefined;
                window._mouseY = undefined;
            });

            resize();
            draw();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 200);
            });

            // 主题变化时，粒子自动适配（因 draw 实时读取主题）
            // 但无需额外操作

            // -------- Popstate --------
            window.addEventListener('popstate', () => {
                const hash = location.hash.replace('#', '');
                const valid = ['home', 'about', 'contact'];
                switchPage(valid.includes(hash) ? hash : 'home', false);
            });

            // -------- Init page --------
            (function init() {
                const hash = location.hash.replace('#', '');
                const valid = ['home', 'about', 'contact'];
                const target = valid.includes(hash) ? hash : 'home';
                pages.forEach(p => p.classList.remove('active'));
                const el = document.getElementById('page-' + target);
                if (el) el.classList.add('active');
                updateNav(target);
            })();

            // -------- Close menu on resize --------
            let rt;
            window.addEventListener('resize', () => {
                clearTimeout(rt);
                rt = setTimeout(() => { if (window.innerWidth > 768) closeMenu(); }, 200);
            });

        })();
    </script>
